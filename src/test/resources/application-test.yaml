spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/internal_request_management_test}
    username: ${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD:changeme}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: test-only-secret-not-for-production-0123456789-abcdef-test-only-secret!
  expiration-ms: 3600000

logging:
  level:
    org.hibernate.SQL: WARN
    org.flywaydb: WARN
